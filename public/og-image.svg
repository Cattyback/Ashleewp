<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e1e3e6"/>
      <stop offset="100%" stop-color="#cbcfd3"/>
    </linearGradient>
    <linearGradient id="card-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d5e60"/>
      <stop offset="100%" stop-color="#2c4748"/>
    </linearGradient>
    <linearGradient id="card-clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b1846f"/>
      <stop offset="100%" stop-color="#94654f"/>
    </linearGradient>
    <linearGradient id="card-mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7095a8"/>
      <stop offset="100%" stop-color="#557388"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2f2e2a" fill-opacity="0.08"/>
    </pattern>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#2f2e2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Page background with dot texture -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left column: brand + headline + tagline -->
  <g transform="translate(72 110)">
    <!-- Brand mark -->
    <g>
      <rect width="64" height="64" rx="14" fill="#2f2e2a"/>
      <rect x="12" y="12" width="26" height="26" rx="5" fill="#355355"/>
      <rect x="26" y="26" width="26" height="26" rx="5" fill="#a37561"/>
    </g>
    <text x="86" y="44" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" fill="#2f2e2a" letter-spacing="-0.5">WorkPuzzle</text>

    <!-- Eyebrow -->
    <text x="0" y="156" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="14" fill="#a37561" letter-spacing="3.5" text-transform="uppercase">FOR STUDENTS</text>

    <!-- Headline -->
    <text x="0" y="208" font-family="DM Sans, system-ui, sans-serif" font-weight="600" font-size="58" fill="#2f2e2a" letter-spacing="-1.5">Organize Google Drive</text>
    <text x="0" y="274" font-family="DM Sans, system-ui, sans-serif" font-weight="600" font-size="58" fill="#2f2e2a" letter-spacing="-1.5">files by course.</text>

    <!-- Subline -->
    <text x="0" y="332" font-family="DM Sans, system-ui, sans-serif" font-weight="400" font-size="22" fill="#54616a">Less hunting through folders.</text>
    <text x="0" y="362" font-family="DM Sans, system-ui, sans-serif" font-weight="400" font-size="22" fill="#54616a">More studying.</text>

    <!-- CTA pill -->
    <g transform="translate(0 410)">
      <rect width="220" height="52" rx="26" fill="#2f2e2a"/>
      <text x="110" y="33" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="17" fill="#d8dbdf">Sign in with Google →</text>
    </g>
  </g>

  <!-- Right column: stacked course cards mockup -->
  <g transform="translate(740 100)">
    <!-- Card 3 (back, mist) -->
    <g transform="translate(40 280) rotate(4)" filter="url(#cardshadow)">
      <rect width="320" height="120" rx="20" fill="#ffffff"/>
      <rect width="6" height="120" rx="3" fill="url(#card-mist)"/>
      <rect x="28" y="22" width="64" height="9" rx="2" fill="#54616a" fill-opacity="0.45"/>
      <rect x="28" y="44" width="200" height="14" rx="3" fill="#2f2e2a"/>
      <rect x="28" y="70" width="140" height="9" rx="2" fill="#54616a" fill-opacity="0.55"/>
      <circle cx="296" cy="32" r="9" fill="#63869a" fill-opacity="0.18"/>
    </g>

    <!-- Card 2 (middle, clay) -->
    <g transform="translate(20 150) rotate(-2)" filter="url(#cardshadow)">
      <rect width="340" height="120" rx="20" fill="#ffffff"/>
      <rect width="6" height="120" rx="3" fill="url(#card-clay)"/>
      <rect x="28" y="22" width="56" height="9" rx="2" fill="#54616a" fill-opacity="0.45"/>
      <rect x="28" y="44" width="220" height="14" rx="3" fill="#2f2e2a"/>
      <rect x="28" y="70" width="160" height="9" rx="2" fill="#54616a" fill-opacity="0.55"/>
      <circle cx="316" cy="32" r="9" fill="#a37561" fill-opacity="0.18"/>
    </g>

    <!-- Card 1 (front, teal) -->
    <g transform="translate(0 20) rotate(1)" filter="url(#cardshadow)">
      <rect width="360" height="120" rx="20" fill="#ffffff"/>
      <rect width="6" height="120" rx="3" fill="url(#card-teal)"/>
      <rect x="28" y="22" width="48" height="9" rx="2" fill="#54616a" fill-opacity="0.45"/>
      <text x="28" y="29" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="10" fill="#a37561" letter-spacing="2">CS 101</text>
      <text x="28" y="58" font-family="DM Sans, system-ui, sans-serif" font-weight="600" font-size="18" fill="#2f2e2a">Intro to Computer Science</text>
      <text x="28" y="82" font-family="DM Sans, system-ui, sans-serif" font-weight="400" font-size="13" fill="#54616a">Prof. Smith · 12 files</text>
      <circle cx="336" cy="32" r="9" fill="#355355" fill-opacity="0.18"/>
    </g>
  </g>

  <!-- Bottom watermark -->
  <text x="72" y="588" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="14" fill="#54616a" letter-spacing="2">WORKPUZZLE · BETA</text>
</svg>
