<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary title & description (used by browser tab + Google SERP) -->
    <title>WorkPuzzle — Organize Google Drive files by course</title>
    <meta
      name="description"
      content="WorkPuzzle organizes your Google Drive files by course. Less hunting through folders, more studying. Built for students."
    />
    <meta name="author" content="WorkPuzzle" />
    <meta name="theme-color" content="#2f2e2a" />
    <meta name="color-scheme" content="light" />

    <!-- Favicons: modern browsers prefer SVG; PNGs are fallbacks for older
         agents and for the home-screen / install dialog. -->
    <link rel="icon" type="image/svg+xml" href="/Ashleewp/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Ashleewp/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Ashleewp/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Ashleewp/apple-touch-icon.png" />
    <link rel="manifest" href="/Ashleewp/manifest.json" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WorkPuzzle" />
    <meta property="og:title" content="WorkPuzzle — Organize Google Drive files by course" />
    <meta
      property="og:description"
      content="Organize your Google Drive files by course. Less hunting, more studying."
    />
    <meta property="og:url" content="https://cattyback.github.io/Ashleewp/" />
    <meta property="og:image" content="https://cattyback.github.io/Ashleewp/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WorkPuzzle — organize Google Drive files by course" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X large-image card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WorkPuzzle — Organize Google Drive files by course" />
    <meta
      name="twitter:description"
      content="Organize your Google Drive files by course. Less hunting, more studying."
    />
    <meta name="twitter:image" content="https://cattyback.github.io/Ashleewp/og-image.png" />
    <meta name="twitter:image:alt" content="WorkPuzzle — organize Google Drive files by course" />

    <!-- Canonical URL — helps Google de-dupe variants -->
    <link rel="canonical" href="https://cattyback.github.io/Ashleewp/" />

    <!-- DM Sans webfont (loaded once at the HTML level for fastest first paint) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
